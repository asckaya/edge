name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: "26"

      - run: vp install

      # Generate src/routeTree.gen.ts (gitignored, produced by the TanStack
      # Start vite plugin at build time) before type-checking so tsc can
      # resolve the './routeTree.gen' module imported by src/router.tsx.
      - run: vp build

      - run: vp check

      - run: vp test
